services:
  postgres:
    image: postgres:16-alpine
    container_name: jobpilot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobpilot
      POSTGRES_PASSWORD: jobpilot_secret
      POSTGRES_DB: jobpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpilot -d jobpilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: jobpilot_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://jobpilot:jobpilot_secret@postgres:5432/jobpilot"
      PGBOSS_DATABASE_URL: "postgresql://jobpilot:jobpilot_secret@postgres:5432/jobpilot"
      NODE_ENV: "production"
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: jobpilot_worker
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://jobpilot:jobpilot_secret@postgres:5432/jobpilot"
      PGBOSS_DATABASE_URL: "postgresql://jobpilot:jobpilot_secret@postgres:5432/jobpilot"
      NODE_ENV: "production"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
